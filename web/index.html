<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Inside UoL - The social pulse of your campus.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Inside UoL">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Inside UoL</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0E0E0E;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: sans-serif;
      color: white;
    }
    .loading-container {
      text-align: center;
    }
    .loader {
      border: 4px solid #1A1A1A;
      border-top: 4px solid #D394FF;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #error-log {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: rgba(255, 0, 0, 0.1);
      color: #ff6e84;
      padding: 15px;
      border-radius: 8px;
      display: none;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      border: 1px solid rgba(255, 0, 0, 0.3);
      z-index: 9999;
    }
  </style>

  <script>
    // Global error handler to catch "white screen" causes
    window.onerror = function(message, source, lineno, colno, error) {
      const errorLog = document.getElementById('error-log');
      if (errorLog) {
        errorLog.style.display = 'block';
        errorLog.innerHTML += '<div>' + message + ' (at ' + source + ':' + lineno + ')</div>';
      }
      return false;
    };
    window.onunhandledrejection = function(event) {
      const errorLog = document.getElementById('error-log');
      if (errorLog) {
        errorLog.style.display = 'block';
        errorLog.innerHTML += '<div>Promise Rejection: ' + event.reason + '</div>';
      }
    };
  </script>
</head>
<body>
  <div class="loading-container" id="loading-indicator">
    <div class="loader"></div>
    <div style="letter-spacing: 2px; font-weight: bold; font-size: 12px;">LOADING VIBE...</div>
  </div>

  <div id="error-log"></div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
